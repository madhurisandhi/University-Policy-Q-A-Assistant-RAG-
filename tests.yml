name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies (tests do not need the embedding model)
        run: pip install pypdf chromadb python-dotenv anthropic pytest
      - name: Run tests
        run: pytest -q
